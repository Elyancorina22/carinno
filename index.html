<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Para mi saliente</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#ffeef5; --card:#fff1f7; --accent:#ff6fa3; --muted:#b44b73; }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg,var(--bg),#fff6fa);
      font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      color:var(--muted);
    }
    .card{
      width:min(720px,92%); background:var(--card); border-radius:20px; padding:40px;
      box-shadow:0 10px 30px rgba(200,100,140,0.12); text-align:center; position:relative;
      overflow:hidden;
    }
    .card:before, .card:after{
      content:""; position:absolute; width:260px; height:260px; border-radius:50%;
      transform:translate(-40%, -60%); opacity:0.12; filter:blur(12px);
    }
    .card:before{ background:radial-gradient(circle at 30% 30%, #ffb6d5, #ff6fa3); left:-40px; top:-80px }
    .card:after{ background:radial-gradient(circle at 70% 70%, #ffd9ea, #ffa1c9); right:-80px; bottom:-100px; transform:translate(20%, 40%) }
    h1{ font-family:'Playfair Display', serif; margin:0 0 10px; font-size:2.2rem; color:var(--accent) }
    p.lead{ margin:0 auto 24px; font-size:1.05rem; line-height:1.6; max-width:54ch; color:#6b2b44 }
    .heart{ display:inline-block; font-size:2rem; color:var(--accent); margin-left:8px; transform:translateY(3px) }
    .btn{
      display:inline-block; margin-top:14px; padding:10px 18px; border-radius:999px; background:linear-gradient(90deg,var(--accent),#ff88b8);
      color:white; text-decoration:none; font-weight:600; box-shadow:0 6px 18px rgba(255,111,163,0.18); border:0; cursor:pointer;
    }
    .kiss-area{ position:fixed; inset:0; pointer-events:none; z-index:9999 }
    .kiss{
      position:absolute; left:0; top:0; font-size:48px; will-change:transform,opacity; user-select:none; pointer-events:none;
      transform-origin:center; opacity:0; display:inline-block; mix-blend-mode:screen;
    }
    @keyframes floatUp {
      0%{ transform:translateY(0) scale(1); opacity:1 }
      100%{ transform:translateY(var(--dy, -120vh)) translateX(var(--tx,0)) rotate(var(--rot,0)); opacity:0 }
    }
    footer{ margin-top:22px; font-size:0.9rem; color:#9a5374 }
    @media (max-width:420px){ .card{ padding:28px } h1{ font-size:1.6rem } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Para mi saliente <span class="heart">❤</span></h1>
    <p class="lead">Aunque nuestros caminos ya no vayan de la mano, quiero que sepas que guardo con cariño cada risa, cada abrazo y cada momento compartido. Te deseo luz en tus días y que siempre encuentres motivos para sonreír.</p>
    <button id="kissBtn" class="btn" type="button">Con cariño</button>
    <div class="kiss-area" id="kissArea"></div>
    <footer>— Siempre te recuerdo con ternura</footer>
  </main>
  <script>
    (function(){
      const btn = document.getElementById('kissBtn');
      const area = document.getElementById('kissArea');
      const body = document.body;
      function rand(min, max){ return Math.random()*(max-min)+min }
      function createKiss(x,y){
        const el = document.createElement('span');
        el.className = 'kiss';
        el.textContent = Math.random() < 0.5 ? '💋' : '❤️';
        const size = Math.round(rand(36,120));
        el.style.fontSize = size + 'px';
        // center the glyph on the click
        el.style.left = (x - size/2) + 'px';
        el.style.top = (y - size/2) + 'px';
        const tx = Math.round(rand(-40,40)) + 'vw';
        const rot = Math.round(rand(-60,60)) + 'deg';
        const dy = '-' + Math.round(rand(60,140)) + 'vh';
        el.style.setProperty('--tx', tx);
        el.style.setProperty('--rot', rot);
        el.style.setProperty('--dy', dy);
        const dur = Math.round(rand(1400,3200));
        el.style.animation = `floatUp ${dur}ms cubic-bezier(.2,.9,.2,1) forwards`;
        area.appendChild(el);
        el.addEventListener('animationend', ()=> el.remove());
      }
      btn.addEventListener('click', (e)=>{
        const bx = e.clientX;
        const by = e.clientY;
        const count = 18;
        for(let i=0;i<count;i++){
          setTimeout(()=> createKiss(bx + rand(-30,30), by + rand(-30,30)), i*35);
        }
      });
    })();
  </script>
</body>
</html>
